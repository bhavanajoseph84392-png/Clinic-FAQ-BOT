<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin 2 - Login</title>
<style>
  :root { --bg:#f4f7ff; --primary:#4f46e5; --ink:#1e293b; --muted:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; font-family:Inter,system-ui,sans-serif; background:linear-gradient(135deg,#eef2ff,#f4f7ff); color:var(--ink); }
  .card { width:100%; max-width:430px; background:#fff; padding:1.5rem; border-radius:20px; box-shadow:0 18px 45px rgba(79,70,229,.16); }
  h1 { margin:0 0 .25rem; font-size:1.5rem; }
  p { color:var(--muted); margin:0 0 1.5rem; }
  label { display:block; font-weight:600; font-size:.9rem; margin:.8rem 0 .3rem; }
  input { width:100%; font-size:16px; min-height:44px; padding:.7rem .9rem; border:1px solid #cbd5e1; border-radius:12px; }
  button { width:100%; min-height:48px; margin-top:1.25rem; border:0; border-radius:12px; background:var(--primary); color:#fff; font-size:1rem; font-weight:700; }
  @media (min-width:768px){ .card{padding:2.5rem;} }
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p>Sign in to your clinic workspace.</p>
    <form onsubmit="return false">
      <label>Email</label>
      <input type="email" placeholder="admin@sunriseclinic.com">
      <label>Password</label>
      <input type="password" placeholder="Your password">
      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
