<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin 2 - Settings</title>
<style>
  :root{--bg:#f4f7ff;--primary:#4f46e5;--muted:#64748b;--ink:#1e293b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .top{background:#fff;padding:1rem;border-bottom:1px solid #e2e8f0}
  .brand{font-weight:800;color:var(--primary)}
  .layout{display:block}
  main{padding:1rem}
  h1{font-size:1.3rem;margin:0 0 1rem}
  .card{background:#fff;border-radius:18px;padding:1rem;margin-bottom:1rem;box-shadow:0 10px 25px rgba(79,70,229,.08)}
  label{display:block;font-weight:600;margin:.8rem 0 .3rem}
  input{width:100%;font-size:16px;min-height:44px;padding:.6rem .8rem;border:1px solid #cbd5e1;border-radius:12px}
  input[readonly]{background:#eef2ff;font-family:monospace;font-size:.8rem}
  button{min-height:44px;border:0;border-radius:999px;padding:.6rem 1.2rem;background:var(--primary);color:#fff;font-size:1rem;font-weight:700;margin-top:1rem}
  @media(min-width:768px){
    .layout{display:flex}
    nav{width:220px;background:#fff;padding:1rem;display:flex;flex-direction:column;gap:.35rem;min-height:100vh}
    nav a{min-height:44px;display:flex;align-items:center;padding:.6rem .8rem;border-radius:12px;text-decoration:none;color:var(--ink)}
    nav a.active,nav a:hover{background:#e0e7ff;color:var(--primary)}
    main{flex:1;padding:2rem;max-width:900px}
    .card{padding:1.5rem}
  }
</style>
</head>
<body>
<div class="top"><span class="brand">ClinicFAQ / Skin 2</span></div>
<div class="layout">
  <nav>
    <a href="#">Dashboard</a><a href="#">Pending</a><a href="#">Analytics</a>
    <a href="#">Answers</a><a href="#">Knowledge</a><a class="active" href="#">Settings</a>
  </nav>
  <main>
    <h1>Clinic settings</h1>
    <div class="card">
      <h2>Emergency contact</h2>
      <label>Clinic phone</label><input value="+91 99999 00000">
      <label>Emergency number</label><input value="112">
    </div>
    <div class="card">
      <h2>Opening hours (Asia/Kolkata)</h2>
      <label>Opens</label><input type="time" value="09:00">
      <label>Closes</label><input type="time" value="18:00">
    </div>
    <div class="card">
      <h2>Embed on your website</h2>
      <p style="color:var(--muted)">Copy this one line into your site's HTML.</p>
      <input id="snippet" readonly value='&lt;script src="https://app.example.com/embed.js" data-clinic="sunrise-clinic" async&gt;&lt;/script&gt;'>
      <button onclick="navigator.clipboard.writeText(document.getElementById('snippet').value); this.textContent='Copied!';">Copy</button>
    </div>
  </main>
</div>
</body>
</html>
