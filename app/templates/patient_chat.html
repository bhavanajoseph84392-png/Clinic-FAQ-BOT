<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ clinic.name }} - Virtual Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="background: var(--slate-100); height: 100vh; display: flex; flex-direction: column;">
  <!-- Chat Shell -->
  <div class="chat-container">
    <div class="chat-header">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 style="font-size: 1.15rem; font-weight: 700;">{{ clinic.name }} Assistant</h3>
          <span style="font-size: 0.8rem; opacity: 0.9;">Patient: {{ patient.name }} ({{ patient.email }})</span>
        </div>
        <span class="badge" style="background: rgba(255,255,255,0.2); color: white; border: none;">Session Active (48h)</span>
      </div>
    </div>

    <!-- Messages Window -->
    <div class="chat-messages" id="messagesBox">
      <!-- Welcome Message -->
      <div class="chat-bubble chat-bubble-bot">
        Hello {{ patient.name }}! Welcome to {{ clinic.name }}. How can I assist you today with our services, operating hours, or consultation questions?
        <div class="chat-source-tag">Source: {{ clinic.name }} FAQ Guide</div>
      </div>
    </div>

    <div id="suggestionsBox" style="display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.5rem 1rem;"></div>

    <!-- Message Input Bar -->
    <form id="chatForm" class="chat-input-bar">
      <input type="text" id="questionInput" class="form-control" placeholder="Ask a question about our clinic..." autocomplete="off" required>
      <button type="submit" id="sendBtn" class="btn btn-primary" style="padding: 0.65rem 1.25rem;">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('questionInput');
    const messagesBox = document.getElementById('messagesBox');
    const sendBtn = document.getElementById('sendBtn');
    const slug = "{{ clinic.slug }}";

    async function submitRating(answerId, value, ratingBar) {
      const buttons = ratingBar.querySelectorAll('button');
      buttons.forEach((button) => { button.disabled = true; });

      try {
        const response = await fetch(`/c/${slug}/answers/${answerId}/rating`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value })
        });
        if (!response.ok) throw new Error('Rating failed');
        const thanks = await response.text();
        ratingBar.textContent = thanks || 'Thanks';
        ratingBar.style.fontSize = '0.8rem';
        ratingBar.style.color = 'var(--slate-500)';
      } catch (err) {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }

    function appendMessage(text, isUser, sourceTitle, answerId, kind) {
      const bubble = document.createElement('div');
      bubble.className = isUser ? 'chat-bubble chat-bubble-user' : 'chat-bubble chat-bubble-bot';
      bubble.textContent = text;
      
      if (!isUser) {
        const sourceSpan = document.createElement('div');
        sourceSpan.className = 'chat-source-tag';
        sourceSpan.textContent = 'Source: ' + (sourceTitle || 'Clinic team');
        bubble.appendChild(sourceSpan);
      }

      if (!isUser && answerId && kind !== 'fallback') {
        const ratingBar = document.createElement('div');
        ratingBar.style.display = 'flex';
        ratingBar.style.gap = '0.5rem';
        ratingBar.style.marginTop = '0.5rem';

        const makeRatingButton = (label, value) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn btn-secondary btn-sm';
          button.textContent = label;
          button.addEventListener('click', () => submitRating(answerId, value, ratingBar));
          return button;
        };

        ratingBar.appendChild(makeRatingButton('Good', 'good'));
        ratingBar.appendChild(makeRatingButton('Bad', 'bad'));
        bubble.appendChild(ratingBar);
      }
      
      messagesBox.appendChild(bubble);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function sendQuestion(question) {
      if (!question) return;

      appendMessage(question, true);
      input.value = '';
      sendBtn.disabled = true;

      const loadingBubble = document.createElement('div');
      loadingBubble.className = 'chat-bubble chat-bubble-bot';
      loadingBubble.textContent = 'Checking clinic information...';
      loadingBubble.id = 'loadingBubble';
      messagesBox.appendChild(loadingBubble);
      messagesBox.scrollTop = messagesBox.scrollHeight;

      try {
        const response = await fetch(`/c/${slug}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: question })
        });

        loadingBubble.remove();

        if (response.ok) {
          const data = await response.json();
          appendMessage(data.text, false, data.source, data.answer_id, data.kind);
        } else {
          appendMessage("Thank you! The clinic will reply to you soon by email.", false);
        }
      } catch (err) {
        loadingBubble.remove();
        appendMessage("Thank you! The clinic will reply to you soon by email.", false);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      sendQuestion(input.value.trim());
    });

    async function loadSuggestions() {
      try {
        const response = await fetch(`/c/${slug}/suggestions`);
        if (!response.ok) return;
        const data = await response.json();
        const box = document.getElementById('suggestionsBox');
        (data.suggestions || []).forEach((text) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn btn-secondary btn-sm';
          button.textContent = text;
          button.addEventListener('click', () => sendQuestion(text));
          box.appendChild(button);
        });
      } catch (err) {
        return;
      }
    }
    loadSuggestions();
  </script>
</body>
</html>
